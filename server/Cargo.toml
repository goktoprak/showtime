# Package name stays `showtime` so the release binary is still built at
# target/release/showtime, which the Dockerfile copies by that path.
[package]
name = "showtime"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { path = "../shared", features = ["ssr"] }

axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "set-header"] }
sqlx = { workspace = true }
libsqlite3-sys = { version = "0.27", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
