# `web` deliberately joins this workspace in stage 4 of the migration, not
# now: a Leptos CSR crate can't be built for the host target, so listing it
# here would break `cargo build` at the root. When it's added it goes in
# `members` with `default-members` kept as the two native crates.
[workspace]
members = ["shared", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
