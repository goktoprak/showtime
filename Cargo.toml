[workspace]
members = ["shared", "server", "web"]
# `web` is a wasm-only crate and cannot be built for the host target, so a
# bare `cargo build` / `cargo test` at the root must skip it. Build it with
# trunk, or with `cargo build -p web --target wasm32-unknown-unknown`.
default-members = ["shared", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
