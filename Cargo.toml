[workspace]
members = ["shared", "server", "web"]
# `web` is kept out of the default set. It does compile for the host target -
# web-sys and wasm-bindgen build natively - but the resulting binary cannot
# run without a DOM, so building it there is pure cost. Build it with trunk,
# or with `cargo build -p web --target wasm32-unknown-unknown`.
# Note that `--workspace` overrides this and will build it for the host.
default-members = ["shared", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
